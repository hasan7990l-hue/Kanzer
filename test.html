<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>PO Connection Test</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
  body{font:15px/1.6 system-ui;background:#0b0d12;color:#e7e9ee;padding:30px;max-width:700px;margin:auto}
  h1{color:#c9a227}
  input,button{width:100%;padding:10px;margin:6px 0;border-radius:8px;
    border:1px solid #232a3a;background:#0e1119;color:#e7e9ee;font:inherit}
  button{background:#c9a227;color:#12151d;font-weight:700;border:0;cursor:pointer}
  #out{font:13px/1.5 ui-monospace;background:#0a0c11;border:1px solid #1d2230;
    border-radius:8px;padding:12px;min-height:120px;white-space:pre-wrap;margin-top:16px}
</style>
</head>
<body>
<h1>PO Connection Test</h1>

<input id="ssid" placeholder="SSID" autocomplete="off">
<input id="uid" placeholder="uid" value="0">
<label><input type="checkbox" id="demo" checked> تجريبي</label>
<button id="go">اتصال</button>

<div id="out">جاهز...</div>

<script>
const $ = id => document.getElementById(id);
const out = m => { $("out").textContent = `[${new Date().toLocaleTimeString()}] ${m}\n` + $("out").textContent; };

$("go").onclick = () => {
  const ssid = $("ssid").value.trim();
  const uid = parseInt($("uid").value || "0", 10);
  const isDemo = $("demo").checked;

  if (!ssid) { out("الصق SSID أولاً"); return; }

  out("جارٍ الاتصال بـ wss://api-eu.po.market ...");

  const socket = io("wss://api-eu.po.market", {
    transports: ["websocket"],
    path: "/socket.io/",
    reconnection: false,
    timeout: 15000,
  });

  socket.on("connect", () => {
    out("✔ WebSocket متصل — إرسال auth...");
    socket.emit("auth", {
      session: ssid,
      isDemo: isDemo ? 1 : 0,
      uid: uid,
      platform: 2,
    });
  });

  socket.on("successauth", () => {
    out("✅✅ المصادقة نجحت! الاتصال المباشر يعمل من GitHub Pages.");
  });

  socket.on("updateBalance", (d) => {
    out(`💰 الرصيد: ${d.balance} ${d.currency || ""}`);
  });

  socket.on("connect_error", (e) => {
    out("❌ فشل الاتصال: " + (e.message || e));
    out("→ على الأرجح Origin مرفوض. سنحتاج Cloudflare Worker وسيط.");
  });

  socket.on("error", (e) => out("⚠ خطأ: " + JSON.stringify(e)));

  socket.on("disconnect", (r) => out("انقطع: " + r));

  setTimeout(() => {
    if (!socket.connected) out("⏱ انتهت المهلة — لم يتصل.");
  }, 16000);
};
</script>
</body>
</html>
